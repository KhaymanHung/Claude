note = "「幫忙」那一句可以省略。"
do = ["talk primo 是", "talk primo 幫忙"]

[[quest.steps]]
title = "上帝之劍：找艾倫"
note = "在前廳找艾倫 (Aaronn)。可選：先去找艾布特 (walk outside → 2s2en)，talk abbott 拜託，give excalibur abbott（不給只是洞穴內的 mob 會攻擊你，可以直接打或先迷倒）。"
do = ["talk aaronn 任務", "talk aaronn ok"]

[[quest.steps]]
title = "上帝之劍：魔窟洞穴找維拉"
note = "被傳送到魔窟洞穴後找到維拉 (Verai)，她會自動給你上帝之劍。"
do = ["3ne2nws3ne2sen"]

[[quest.steps]]
title = "闇夜之劍：找約克"
note = "約克 (Yorke) 要你救被藍道夫擄走的未婚妻翠絲特。"
do = ["map3", "s3e3n2wn2esw2nw", "talk yorke 高手"]

[[quest.steps]]
title = "闇夜之劍：殺藍道夫"
note = "找到藍道夫 (Randolph) 殺掉，取得闇夜之劍。"
do = ["e;n;n;n;n;n;e;e;n;n;w;n"]

[[quest.steps]]
title = "闇夜之劍：送回翠絲特"
note = "回去後翠絲特自動獲救。可選（解 ring 用）：把約克打到紅血，他會認輸。"
do = ["s;e;s;s;w;w;s;s;s;s;s;w"]

[[quest.steps]]
title = "太陽之劍：找愛葛妮絲"
manual = true
note = "到 map1 風采之都北方十里坡，n 到底找愛葛妮絲 (Agnesi)，talk agnesi 任務。可選：talk primo 高手 得知三位高手名字。"

[[quest.steps]]
title = "太陽之劍：奧斯蒙"
manual = true
note = "奧斯蒙 (Osmond) 在 map3 聖域分歧點 e2ne。talk osmond 高手，往北殺骷髏王 (skeleton king)，回來 talk osmond 擊殺。可選（解 ring 用）：把奧斯蒙打到紅血。"

[[quest.steps]]
title = "太陽之劍：諾曼"
note = "從約克處出發。不必準備 skying，給不給結果都一樣，直接打到紅血，諾曼認輸並給你太陽之劍。"
do = ["e;s;s;e;n;w;w;s;e;e;s;s;s;e;e;e;s;s;s;s;e;e;s;e;e;d;n;n;n;e;s;s;s;e;s;e;e;e;e;n;w;s;s;e;s;s;w;w;s;s", "talk norman 高手"]

[[quest.steps]]
