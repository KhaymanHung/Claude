rewards = ["諸神水晶 (god_crystal)", "聖戰神劍（nosave，hr10 dr10 damage 60-80）", "迅雷魔法指環（需先把約克和奧斯蒙打到紅血）", "魔界要塞入場權（軒轅劍合成）"]

[[quest.steps]]
