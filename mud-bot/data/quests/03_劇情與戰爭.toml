do = ["2sws3wn3w2s"]

[[quest.steps]]
title = "異星球流程"
manual = true
note = """1. 到西理亞城按開關，開啟能源庫拱門。
2. 進能源庫走到盡頭開 s 的門，打 mob 拿石頭。
3. 到中央控制室按按鈕，開啟北山奈城和東凱薩城拱門。
4. 東凱薩城密室按按鈕開啟能源庫地下密門；北山奈城密室也按按鈕（兩城的按鈕不能同時按）。
5. 能源庫往下找密門，touch pool。
6. 中央控制室往東開門按按鈕，能源庫最南方的密門會開。
7. 沿路到異星王王宮追殺異星王（共出現 3 次後逃走）。
8. 拿到中央控制室的 stone 按按鈕，王宮深處出現往上的路。
9. 走到底殺異星王（restore 3 次、兩條命，會到處跑）。"""

