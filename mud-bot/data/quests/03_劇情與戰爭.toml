name = "異星球"
aliases = ["異星球", "異星王", "塔坦", "異星間諜"]
route_note = "戰爭區域在風采之都和西郊。"
note = "目的：殺死 3 大 mob（有 medal）。殺塔坦後找異星間諜 (spy，會藏匿，要 detect hidden)，先攻擊後 spy 死掉會有一群異星人入侵（有戰功）。3 大 mob 每隻有 3 次 restore。在時限內殺死 3 大 mob 就能搭飛船進攻異星球（研究院西南方，約十分鐘起飛）。"

[[quest.steps]]
