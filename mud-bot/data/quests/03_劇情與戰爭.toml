note = "三把劍交給普利莫，身上要留 50 kg 負重。"
do = ["give sword primo", "give sword primo", "give sword primo", "talk primo 秘寶"]

[[quest.steps]]
title = "第二階段：前往奈落打闇之邪神"
note = "務必穿上 god_crystal，可以擋掉特攻。在奈落底部殺闇之邪神，得到封神印 (dark_crystal)。如果死了或忘了穿，等 reborn 回去 talk agnesi 出發，不必重解。"
do = ["recall", "n;n;n;w;n;n;e;n;d;d;n;n;e;n;n;w;n;w;n;u;u;n;n;n;n;n;n", "talk agnesi 出發"]

[[quest.steps]]
title = "回報普利莫"
note = "普利莫會帶你到魔法幻界。"
do = ["give dark_crystal primo", "talk primo 辦法", "talk primo 神的祝福"]

[[quest.steps]]
title = "第三階段：打五位神之戰士"
manual = true
note = """在魔法幻界連續 talk primo 召喚，打五位神之戰士（每位打到面無血色會自動停止）：
泰德泰倫斯 → 賽門羅哲 → 白傑夫昆 → 伍德洛耶魯 → 丹尼爾路，各得五分之一的神之祝福。
被打死或 recall 的話，回去找 primo talk 召喚，會改在公會裡打，比較好打。全部打完後 talk primo 得到了。"""

[[quest.steps]]
title = "第四階段：打撒旦"
note = "被傳送到奈落底部，先打邪神 (evil god)，到主殿殺邪神撒旦。在邪神或撒旦處死亡的話，等 reborn 回去 talk aaronn 出發，不必重解。"
do = ["talk aaronn 出發", "s;e;s;s;w;s;e;e;s;w;s;w;w;s;s;s;s;e;e;e;s;w;s;s;s;s;u;u;u"]

[[quest.steps]]
title = "拿獎勵"
note = "回去找艾布特。注意：拿了裝備 qmark 會消掉，就無法進入魔界要塞。"
do = ["talk abbott 我打敗了撒旦", "talk abbott 給我獎勵", "talk abbott 給我獎勵"]

[[quest.tips]]
title = "軒轅劍合成（魔界要塞）"
items = [
  "解完闇的繼承者得到聖戰神劍 (Holyer war sword) 和魔界要塞入場權",
  "要塞內隨機會有不同妖怪 Boss 帶小兵進攻，有 qmark 的人打死可得合成元素（共七種）",
  "把劍與元素融合（失敗機率頗高）得到新武器，重複直到集齊七把",
  "七把子劍：爆 雷霆動神刃、異 魔法冰晶劍、滅 魔鬥戰劍、喪 斬妖牙、歿 靈切刃、極 天空追風劍、靈 流星碎地劍",
  "把七把交給造劍師父，talk 造劍師父 上古的神劍 → yes，成功得到真 軒轅劍（也可能失敗）",
  "真 軒轅劍：No Save，傷害 70-85，dr+12 hr+13，mv/hp/mana -100，con/wis/dex -2，int/str +1。BaBi 評語：頗爛，但解謎的樂趣大於拿 eq",
]

