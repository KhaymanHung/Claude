# 解謎資料（第 1 部分）
# 每個 [[quest]] 是一個謎題，[[quest.steps]] 是依序執行的步驟
#   do     ：要送出的指令；路線寫法（/、3w2s、map2…）會自動展開，詳見 data/README.md
#   manual ：true 表示需要你自己處理（打王、走迷宮、等時間），程式只顯示說明

[[quest]]
id = "hell"
name = "酆都"
aliases = ["hell", "地獄", "十殿閻王", "孟婆", "地藏王", "酆都熱鬥篇"]
area = "酆都熱鬥篇"
intro = "孟婆分別拜訪十殿閻王後，地獄傳出地藏王菩薩被囚禁的消息。菩薩身邊的童子向你求救，到地獄救出地藏王菩薩。"
route_note = "從絕情谷最裡面往下跳，或請牧師傳送。"
needs = ["沒有必備物品，建議多帶 food 和備用武器"]
rewards = ["金剛圈", "金錢", "十殿閻王的 no save 裝備"]

