[[quest]]
id = "camelot"
name = "騎士堡"
aliases = ["騎士堡", "camelot", "arthur", "亞瑟王", "聖十字", "holy cross"]
area = "騎士堡"
level = "55-60"
intro = "騎士堡面臨重大危機！黑騎士揮軍前來，王后被捉去當人質。"
note = "現在騎士可以 summon，學 earthslice 基本上只要走到 skinner 那裡再找人 summon 即可，以下路線僅供參考。"
rewards = ["聖十字 (holy cross)", "可向亞瑟王學大地之斬、風嘯之斬、十字斬"]

[[quest.steps]]
title = "準備（學 earthslice 用）"
manual = true
note = """建議 changebody：wis 22、dex 22，學完再改回 18 18 18 18 18。
建議技能：pick lock、peek、steal、hide、sneak、pretend（700 點）；detect magic、infravision、cure light、cure serious、refresh、control weather、fly（90 點）。"""

[[quest.steps]]
title = "前往騎士堡"
note = "看到西塞斯後：一直往南到底，能東就東、能南就南，找到往下的路到廢棄的港口（sneak、hide）。渡海（fly 或 boat）後往南找 [淺海海域]，往西一直走到北歐，往南到阿爾卑斯，一直往西（經英吉利海峽）再往北，join。"
do = ["/3w3se", "look painting"]

[[quest.steps]]
title = "進騎士堡"
manual = true
note = "進騎士堡後往北一格整裝：卸下照明器具，cast infravision、sneak、hide。分岔路口打 look 看敘述指路，可以找隻 robber 來 pretend。到騎士森林後，四方向出口那格其中一個方向是騎士堡之路，沒有 robber 的方向機率較大。"

[[quest.steps]]
title = "打亞瑟王 (Arthur)"
manual = true
note = """1. 先殺梅林 (merlin，在 arthur 的 n2u)，需要拿假 holy 當 key。小心梅林的 blizzard，可以 ko 或 dark 他（dark 後他就不能 full arthur）。
2. 先 dm arthur，並把藍斯若特 (sir) blind + fly，否則他會 rescue 幫 arthur。
3. 騎士一開始 at flee，等 arthur 黃血或紅血時 agg 0 用 ear 猛打。"""

[[quest.steps]]
title = "打 sable（學十字斬用）"
manual = true
note = "先殺 vivien（進 arthur 祕道處 4w 再往 n），她攻擊魔法很多，最好由 ill-out-wiz 對付。小心 sable 的 disarm。殺 sable 後把頭和 sable amulet 交給 Arthur 才能學十字斬。"

[[quest.steps]]
