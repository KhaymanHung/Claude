[[quest.steps]]
title = "打十殿閻王"
manual = true
note = "依上表打完十位閻王，取得十件 no save 裝備。可以多帶幾隻角色一起去，之後能量產孔雀羽。"

[[quest.steps]]
title = "找傳送點"
manual = true
note = "走到破裂空間，look 每個出口，找到敘述是「這兒方向看過去並沒有什麼特別的」的那格，從那邊過去就是傳送點。"

[[quest.steps]]
title = "依序穿裝備並說暗語（順序不能錯）"
note = "每穿一件都要說「天地我最大」。不確定哪件時可以 exam <裝備> 看提示。wear fire 有可能穿到雷火，要注意。"
do = [
  "wear 飛焰", "say 天地我最大",
  "unlock n", "open n", "n",
  "wear helm", "say 天地我最大",
  "wear 滅神", "say 天地我最大",
  "wear 毀靈", "say 天地我最大",
  "wear 斷天", "say 天地我最大",
  "wear dark", "say 天地我最大",
  "wear 化魂", "say 天地我最大",
  "wear storm", "say 天地我最大",
  "wear 雷火", "say 天地我最大",
  "wear rain", "say 天地我最大",
]

[[quest.steps]]
title = "地藏王出現：拿孔雀羽"
note = "先別急著 say yes。no save 裝備會扣屬性，確認還穿得動 50 kg 的孔雀羽；不夠就 wear 魔法手套加 str，或 quit 重新登入恢復屬性。"
do = ["say yes"]

[[quest.steps]]
title = "通過迷橋到孟婆處"
manual = true
note = "被傳送到迷橋後走到終點，這裡的 mob 很強，沒把握就 blind 再 flee。到終點 open s → s 就是孟婆這邊，四處找孟婆。"

[[quest.steps]]
title = "準備打孟婆"
note = "找到孟婆後 follow 她並 dispel magic（五次內應能成功），再上 out/san/bar，agg 0。"
do = ["follow 孟婆", "cast 'dispel magic' 孟婆"]

[[quest.steps]]
title = "穿孔雀羽並求救"
note = "穿孔雀羽和 say 菩薩幫我一定要在同一格。孔雀羽要全新沒穿過的。之後切記不要去 clear。"
do = ["wear 孔雀羽", "say 菩薩幫我"]

[[quest.steps]]
title = "打孟婆"
manual = true
note = "孟婆會攻擊你，不要硬碰硬：用 ear 後 flee（或 at flee）反覆打七八下，再 kill 孟婆，地藏王菩薩就會出現。"

[[quest.steps]]
title = "拿獎勵"
do = ["say 地藏王菩薩你好", "get all", "recall"]

[[quest.tips]]
title = "量產孟婆裝備"
items = [
  "孟婆不會主動攻擊，第一件事是 dispel magic 她",
  "前段 at flee 最危險，孟婆一次約打 14xx，碰到 lag 可能連打兩三下",
  "孟婆血量約 22xxx，ear 一次 1000 約打十下她才開始逃；準備五到十把以上武器（美工刀最佳）",
  "她 full 之後又要開始逃，打到換她逃為止；追殺時不要用 soul 這類沒攻擊力的法術",
  "用 wind 追殺效果更好，她根本來不及 full",
  "給她一把 olympus 的 spoon，她就不能用 wind",
]

[[quest]]
id = "maze"
name = "魔王迷宮"
aliases = ["maze", "迷宮", "黑堡", "骯髒嬰兒"]
area = "魔王迷宮"
level = "40-60"
intro = "一個嬰兒失蹤了，你追到了神秘的魔王迷宮。要如何通過迷宮呢？"
route = ["map3", "s6e7n"]
note = "前五層（石牆間、花園間、地道中、沼澤間、森林中）每層有幾種 mob，其中一種會主動攻擊。一般需要 30～60 分鐘。打完 stone 後可以集體傳送，適合組團。"
rewards = ["加 con 的 toy（回答 yes）", "加 dr 的 toy（回答 no 並殺掉嬰兒）"]

[[quest.steps]]
title = "第一層 石牆間（約 3 分鐘）：拿石之精"
manual = true
note = """石之精在西南方，出口在東北方。mob：毒蛇藤蔓、食人藤蔓（主動攻擊）、吸血藤蔓。
走法：朝西南走可找到石之精。看到出口為 es 時往 s 走到 T 字路，再往 w 通往 stone。
看到出口為 ne 時，往 e 走到第一個 T 字路，往 e 走到第二個 T 字路再 n，就通往第二層。"""

[[quest.steps]]
title = "第二層 花園間（約 5 分鐘）：拿花之精"
manual = true
note = """花之精在東南方，出口在西北。先拿到爛木牌並找到謎語人，穿上爛木牌後：
ta man 謎語 → talk man yes → ta man 左問右 → 回答正確答案（和問的結果相反的方向）。
mob：捕蠅草、虎頭蜂（主動攻擊，身上有蜂蜜）、人面蝶。
走法：第一個 T 字路一邊往 stone，另一邊通第二個 T 字路；第二個 T 字路其中一邊通第三個 T 字路，到了第三個 T 字路 w 是 man，另一邊是 sign。"""

[[quest.steps]]
title = "第三層 地道中（約 8～10 分鐘）：拿土之精"
manual = true
note = """土之精在西南，通常出現在連續走過三個三岔出口的地方，可以用 scan 找。出口在東北。
mob：水雲鼠（主動攻擊）、粉紅蟑螂、迷糊蛙。
走法：沿路在 T 字路作記號，第四個 T 字路 w 方向是 stone；另一邊往第五、第六個 T 字路，第六個 T 字路其中一邊是出口。"""

[[quest.steps]]
title = "第四層 沼澤間（約 3 分鐘）：拿水之精"
manual = true
note = """走到 [出口: 北 東 南 西] 這一格，其中一個方向是出口，一個是單行道會繞回來，一個回第三層。
mob：水棲甲蟲、酒香蛇、刺蝟草（很兇，記得上聖光和聖佑術）。
走法：走到十字路，除了來路外，出口為 ns 的通往 stone，出口為 we 的通往出口。"""

[[quest.steps]]
title = "第五層 森林中（約 5 分鐘）：拿樹之精"
manual = true
note = """樹之精在北方，出口在西南。mob：飛天松鼠、背刺厥（主動攻擊）、貓臉香菇、破碎樹。
走法：一直往 n，不能 n 就 e 或 w 再 n，重複直到找到 stone。
出口往 w 走到沒路再 s，然後 w。這層迴圈最多，小心原地繞圈。"""

[[quest.steps]]
title = "交出五顆精石"
note = "在第五層出口（敘述有 stone 的地方）依序交出，之後會被傳送到風之草原、冰之高地、火之谷或沙之丘其中之一。"
do = ["give flower stone", "give tree stone", "give water stone", "give soil stone", "give stone stone"]

[[quest.steps]]
title = "傳送到黑堡"
manual = true
note = "先打精靈拿物品，找到敘述有 [hole] 的地方，在正確時間 give <物品> hole 就會傳送到黑堡。物品與時間見下表。"

[[quest.steps]]
title = "救骯髒嬰兒"
note = "殺善心惡魔 (good devil) 後骯髒嬰兒 (dirty baby) 會出現。回答 yes 得到加 con 的 toy；回答 no 再殺掉他得到加 dr 的 toy。"
do = ["say 來!哥哥抱你"]

[[quest.tables]]
title = "各傳送區的物品與時間"
headers = ["區域", "物品與時間"]
rows = [
  ["沙 (sand)", "十字狀的狗屎 am 5、十字狀的葉子 pm 7"],
  ["火 (fire)", "十字狀的樹枝 pm 3、十字狀的葉子 am 4、十字狀的石頭 pm 7"],
  ["風 (wind)", "十字狀的石頭 am 1、十字狀的樹枝 pm 7、十字狀的葉子 am 9"],
  ["冰 (ice)", "十字狀的石頭 am 11"],
]

[[quest.tips]]
title = "附加說明"
items = [
  "guard 只會在原本那格附近逃跑",
  "有些方向偶爾會變，但正確出口不變；花之層和土之層的關鍵房間出口比較會變",
  "就算有地圖也要常去，用經驗彌補",
]

[[quest]]
id = "sleeping-beauty"
name = "睡美人"
aliases = ["睡美人", "sleeping beauty", "公主", "極光腰帶"]
area = "睡美人"
level = "60"
route_note = "由風采之都的說書人前往（見 map1 註解）。"
needs = [
  "超合金：到 A 找泉水精靈交談「發生了什麼事」和 yes，帶到泉水處交談「要」",
  "隕石：B 的四個角落，每到 12 點 reborn 一顆",
  "精靈的祝福：到 C 找精靈之王交談「精靈的祝福」「什麼水果」，到生菜沙拉找水果給他，再交談「精靈的祝福」",
  "黃銅十字架：金字塔黃金殿堂（u n e u s d）",
  "ankh（打邪靈必備）",
]
rewards = ["真理之劍", "美德之盾", "神聖十字架（可上 san 十次）", "極光腰帶", "魔龍戰甲（第二次解）", "邪靈臂紋（第二次解）"]

[[quest.steps]]
title = "找佛娜仙女"
do = ["talk mistress 拯救公主", "talk mistress why"]

[[quest.steps]]
title = "打敗五位王子"
manual = true
note = """膽小的王子：talk princess 快滾!!（有時要說好幾次）。貪婪的王子：給 0.1m 或殺掉。惡劣王子、聰明王子：殺。
英勇王子最難打，需要 dm 和 dark；ten-kni 可以 dm 成功後用 ten，連三下立刻 recall 再回來。
打敗時會出現「你打敗了他」，沒出現就要重打。"""

[[quest.steps]]
title = "回報佛娜仙女，換真理之劍"
note = "帶泉水精靈到泉水處取得超合金，給佛娜仙女得到真理之劍。劍不見了可以 talk mistress 劍遺失了。"
do = ["talk mistress 沒有對手了"]

[[quest.steps]]
title = "梅莉仙女：換美德之盾"
note = "給梅莉仙女隕石；再找精靈之王拿精靈的祝福給她，得到美德之盾。盾不見了可以 talk mistress 盾弄丟了。"
do = ["talk mistress 拯救公主"]

[[quest.steps]]
title = "芙蘿拉仙女：換神聖十字架"
note = "答案是十字架（可以問其他仙女確認：上午找梅莉、下午找佛娜）。給她黃銅十字架得到神聖十字架。"
do = ["talk mistress 拯救公主", "talk mistress 打敗邪靈", "talk mistress 邪靈懼怕的東西", "talk mistress 十字架"]

[[quest.steps]]
title = "打邪靈"
manual = true
note = "talk mistress 準備好了，邪靈在一個可以往 d 的地方。一定要裝 ankh，用 at flee 順利的話不必吃 food。殺死後拿邪靈之魂，再 talk mistress 邪靈死了。"

[[quest.steps]]
title = "進魔山打女巫和魔龍"
manual = true
note = """在有 [sign] 的地方往北進魔山，到沼澤地往上。往西北走，[東西南北] 那格一定要轉西。
藤蔓用石中劍自動反擊後 at at wind；荊棘攻擊力大，先補滿血。女巫和魔龍都可以 at flee。
打死女巫再打魔龍，拿鑰匙和魔龍之鱗。魔龍有兩隻：出現在南北時往南打，東西時往西打。"""

[[quest.steps]]
title = "救公主"
manual = true
note = """進囚禁之塔往最上層走：第一層約 wwn 找往上的路，其他層順時鐘走；有個只有 [北] 的地方，自己開門往上。
到最上層說「公主!!我來救妳了!!」，往上見到公主後 talk princess yes。
帶公主到最底部，往 ne 公主會發現密道往下，見到國王說 yes 得到極光腰帶。"""

