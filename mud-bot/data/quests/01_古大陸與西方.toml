[[quest.steps]]
title = "殺年獸"
manual = true
note = """年獸 HP 約 21000，會 full heal 和 restore（dark 無效），見光會 full heal。
1. 先 blind（防止有人衝過來），用 ear 打到 hp 12xxx。
2. 開始 dark（先打再 dark，否則打到快死時 dark 已經沒了）。
3. 打到 hp 剩 1000 出頭就 cure blind，年獸會開始逃並見光 full heal；追殺時 remove 照明裝備。
4. 走到和年獸同一格時再 wear 照明裝備和包袱。
成功條件：不能 blind 年獸、要穿照明裝備、要穿包袱。
另法：dm 掉年獸的 detect invis，打到 14xx 以下後 cure blind，再隱形追殺，攻擊前要先 visible。"""

