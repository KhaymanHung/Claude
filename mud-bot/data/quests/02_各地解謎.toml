[[quest]]
id = "sanctuary"
name = "聖域"
aliases = ["聖域", "sanctuary", "雅典娜", "athena", "聖鬥士", "青銅水晶", "白銀聖鎧", "皓金神劍"]
area = "聖域"
level = "55-60"
intro = "雅典娜是古希臘的戰神，傳說要見到她就必須到聖域。"
route = ["/3w3se", "look painting", "s13w", "s2w2sws3wnw4n2wu"]
route_note = "look painting 後 s13w 沿途有小兵。"
needs = ["kawa", "玫瑰花 rose（map3 → s3e3n2w 附近）", "shield", "輪迴之光 (saint)", "remove nodrop"]
rewards = ["依選擇：忠誠＝青銅水晶、勇氣＝白銀聖鎧、榮譽＝皓金神劍"]
note = "重解拿裝備時記得 quests cancel 聖域 和 quests clear。"

[[quest.steps]]
title = "找紫龍拿破損龍盾"
manual = true
note = "到聖域後 13n（12n 時金牛座會攻擊你）。找青龍座聖鬥士紫龍 talk saint yes。如果金牛座沒攻擊你，要先去 quests clean。"

[[quest.steps]]
title = "獅子座與處女座"
manual = true
note = "2e6nu（這裡記為 A），3n 附近找獅子座殺他拿天秤座聖符（也可以不打 leo，到 gold 處撿）。再 4n 附近找處女座殺他拿輪迴之光（不好打，需要 dark；騎士用 wind 要兩下）。"

[[quest.steps]]
title = "牡羊座穆斯：新生龍盾"
manual = true
note = "回聖域路口 4n 找牡羊座穆斯，給他破損龍盾和輪迴之光，換成新生龍盾，拿去給紫龍加龍氣（必要）。"

[[quest.steps]]
title = "金色雕像"
manual = true
note = "從 A 處 10n2se 把天秤座聖符給金色雕像，帶著走 sws。控制方向：say libra＝南、capricorn＝西、aries＝北、cancer＝東。巨型雕像死後拿出黃金聖鑰 (key) 和黃金聖水 (potion，要解磁)。"

[[quest.steps]]
title = "冰河項鍊"
manual = true
note = "解開南邊的門，西方的天蠍座會攻擊你（可以 flee），往西找白鳥座冰河給他 potion，得到冰河項鍊（必要）。"

[[quest.steps]]
title = "兩座迷宮"
manual = true
note = "從冰河往西走到底再往南到北風之道（迷宮 A）。出迷宮到射手宮（注意搜尋聖弓和聖箭），往南進迷宮 B（7 路迷宮）。"

[[quest.steps]]
title = "阿修羅、水瓶座、雙魚座"
manual = true
note = "出迷宮到無底地塹，往南遇阿修羅（打他拿山羊座聖衣一定要有龍氣才殺得死）。8s2es 找水瓶座卡繆給冰河項鍊（必要；打水瓶座聖衣要 dark），2se 找雙魚座給 rose（必要）。"

[[quest.steps]]
title = "見教皇與雅典娜"
manual = true
note = "傳送到玫瑰道後往上到教皇聖殿，3n 找教皇 talk saint 雅典娜（一次只能一人）。先跟教皇 talk 三件事，再往上找雅典娜 talk anthena yes，會回復所有 mana 並傳送回市中心。"

[[quest.tables]]
title = "聖域地圖"
headers = ["西側（由下往上）", "東側（由下往上）"]
rows = [
  ["牡羊宮 → 金牛宮 → 雙子宮（大道分岔口）", "雅典娜 → 天梯 → 教皇聖殿 → 奪命玫瑰道"],
  ["巨蟹宮 → 落石崖 → 巨石臺階", "雙魚宮 → 吹雪之路 → 水瓶宮"],
  ["獅子宮 → 光明大道 → 處女座", "山羊宮 → 無底地塹 → 射手宮"],
  ["巨石大道 → 力牆之內 → 天秤宮", "北風之路 → 天蠍宮 → 嘆息之門 → 天秤宮"],
]

[[quest.tips]]
title = "簡易版解法"
items = [
  "身上先備好 rose 和 kawa，並先取得龍氣",
  "請牧師傳到巨石大道 → 往 w 走到底再 s 進北風之道迷宮",
  "出迷宮到射手宮 → 往 s 進 7 格迷宮",
  "出來到無底地塹往南見阿修羅（s 門沒開就殺阿修羅）",
  "8s2es 找水瓶座（s 門沒開就給 kawa），2se 找雙魚座給 rose，順路找到教皇",
]

