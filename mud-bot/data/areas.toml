# 區域資料（由攻略整理）
# route：從回城點出發的走法，寫法同解謎資料（/ 是回城、map2、map3 是捷徑）
# [[hunt]] 是 #farm 用的練功設定：approach 是怎麼走到練功區，patrol 是在區域裡巡邏的路線
#   攻略沒有寫巡邏路線，第一次去可以用 #record 記錄你自己走的路，存成 data/user_routes.toml

# 常用捷徑，路線裡可以直接寫名稱
[places]
"/" = ["recall"]
map2 = ["/3w4s", "talk wizard help"]   # 古代東方大陸（打工巫師）
map3 = ["/3w3se", "look painting"]      # 西方大陸（博物館）

# 可以用 rnote 傳送的房間：區域 → 房間名稱
